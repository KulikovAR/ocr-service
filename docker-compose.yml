services:
  ocr-app:
    build:
      context: ./app
      dockerfile: ../docker/php/Dockerfile
    container_name: ocr-app
    restart: unless-stopped
    depends_on:
      ocr-db:
        condition: service_healthy
      ocr-redis:
        condition: service_healthy
    environment:
      - DB_HOST=${DB_HOST}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    working_dir: /var/www
    volumes:
      - ./app:/var/www
      - ./.env:/var/www/.env
    networks:
      - cargis-ocr

  ocr-app-queue:
    build:
      context: ./app
      dockerfile: ../docker/php/Dockerfile
    container_name: ocr-app-queue
    restart: unless-stopped
    depends_on:
      - ocr-app
    working_dir: /var/www/
    volumes:
      - ./app:/var/www
      - ./docker/queue:/usr/local/bin/queue
      - ./.env:/var/www/.env
    command: /usr/local/bin/queue/start-queue.sh
    networks:
      - cargis-ocr

  ocr-db:
    image: mysql:8.0
    container_name: ocr-db
    restart: always
    env_file: .env
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    command: '--default-authentication-plugin=mysql_native_password'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      start_period: 10s
      interval: 15s
      timeout: 5s
      retries: 3
    ports:
      - ${DB_PORT}:3306
    volumes:
      - ocr-db:/var/lib/mysql
    networks:
      - cargis-ocr

  ocr-redis:
    image: redis:7-alpine
    container_name: ocr-redis
    restart: always
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - ocr-redis:/data
    networks:
      - cargis-ocr

  ocr-nginx:
    image: nginx:stable-bookworm
    container_name: ocr-nginx
    depends_on:
      - ocr-app
    restart: unless-stopped
    ports:
      - ${NGINX_HTTP_PORT}:80
    volumes:
      - ./app/public:/var/www/public
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cargis-ocr

volumes:
  ocr-db:
    labels:
      project: "cargis-ocr"
  ocr-redis:
    labels:
      project: "cargis-ocr"

networks:
  cargis-ocr:
    #name: ftl-backend_transportation
    #external: true
